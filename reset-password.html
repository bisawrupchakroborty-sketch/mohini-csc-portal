<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohini CSC Centre — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f6f8fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-wrapper{width:100%;max-width:460px}
    .login-brand{text-align:center;margin-bottom:32px}
    .login-brand img{width:72px;height:72px;object-fit:contain;margin:0 auto 14px;border-radius:16px;background:#fff;padding:10px;border:1px solid #e2e8f0}
    .login-brand h1{font-size:22px;font-weight:800;color:#172033;letter-spacing:.02em}
    .login-brand p{font-size:13px;color:#64748b;margin-top:4px}
    .login-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.06);text-align:center}
    .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .btn-primary{background:#1665d8;color:#fff}
    .btn-primary:hover{background:#0f4faa;box-shadow:0 4px 12px rgba(22,101,216,.3)}
    .back-link{text-align:center;margin-top:20px;font-size:13px;color:#64748b}
    .back-link a{color:#1665d8;font-weight:600;text-decoration:none}
    .back-link a:hover{text-decoration:underline}
    .icon{font-size:48px;margin-bottom:16px}
    .info-box{background:#dbeafe;border:1px solid #93c5fd;border-radius:10px;padding:14px 16px;margin-bottom:20px}
    .info-box b{font-size:13px;color:#1e40af;display:block;margin-bottom:4px}
    .info-box p{font-size:12px;color:#1d4ed8;line-height:1.5}
    @media(max-width:480px){.login-card{padding:24px 20px}}
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <img src="logo.png" alt="Mohini CSC Centre">
      <h1>MOHINI CSC CENTRE</h1>
      <p>Reset Password</p>
    </div>

    <div class="login-card">
      <div class="icon">📧</div>
      <div class="info-box">
        <b>Check Your Email</b>
        <p>We've sent a password reset link to your email. Click the link in the email to set a new password.</p>
      </div>
      <p style="font-size:12px;color:#64748b;margin-bottom:20px">
        Didn't receive the email? Check your spam folder or try again.
      </p>
      <button class="btn btn-primary" onclick="window.location.href='forgot-password.html'">Try Again</button>
      <p class="back-link"><a href="login.html">← Back to Login</a></p>
    </div>

    <p style="text-align:center;font-size:11px;color:#94a3b8;margin-top:20px">© 2026 Mohini CSC Centre. All rights reserved.</p>
  </div>
</body>
</html>
