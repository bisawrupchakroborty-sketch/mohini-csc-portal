<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohini CSC Centre — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f6f8fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-wrapper{width:100%;max-width:460px}
    .login-brand{text-align:center;margin-bottom:32px}
    .login-brand img{width:72px;height:72px;object-fit:contain;margin:0 auto 14px;border-radius:16px;background:#fff;padding:10px;border:1px solid #e2e8f0}
    .login-brand h1{font-size:22px;font-weight:800;color:#172033;letter-spacing:.02em}
    .login-brand p{font-size:13px;color:#64748b;margin-top:4px}
    .login-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:#172033;margin-bottom:6px}
    .form-group input{width:100%;padding:11px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;color:#1e293b;background:#fff;transition:border .15s;font-family:inherit}
    .form-group input:focus{outline:none;border-color:#1665d8;box-shadow:0 0 0 3px rgba(22,101,216,.1)}
    .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .btn-primary{background:#1665d8;color:#fff}
    .btn-primary:hover{background:#0f4faa;box-shadow:0 4px 12px rgba(22,101,216,.3)}
    .btn-primary:disabled{background:#93b8e8;cursor:not-allowed;box-shadow:none}
    .back-link{text-align:center;margin-top:20px;font-size:13px;color:#64748b}
    .back-link a{color:#1665d8;font-weight:600;text-decoration:none}
    .back-link a:hover{text-decoration:underline}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 15px rgba(0,0,0,.1);z-index:999;opacity:0;pointer-events:none;transition:all .3s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .error-text{color:#dc2626;font-size:12px;margin-top:6px;display:none}
    @media(max-width:480px){.login-card{padding:24px 20px}}
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <img src="logo.png" alt="Mohini CSC Centre">
      <h1>MOHINI CSC CENTRE</h1>
      <p>Reset Your Password</p>
    </div>

    <div class="login-card">
      <div class="form-group">
        <label>Registered Email Address</label>
        <input type="email" id="fpEmail" placeholder="your@email.com">
        <div class="error-text" id="emailError">Please enter a valid email</div>
        <div class="error-text" id="notFoundError" style="color:#dc2626">No account found with this email</div>
      </div>

      <button class="btn btn-primary" id="fpBtn" onclick="sendResetCode()">Send Reset Code</button>

      <p class="back-link">Remember password? <a href="login.html">Login here</a></p>
    </div>

    <p style="text-align:center;font-size:11px;color:#94a3b8;margin-top:20px">© 2026 Mohini CSC Centre. All rights reserved.</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    emailjs.init('1krGbBYt3akDo6BMT');
    var SVC = 'service_ejlycjk';
    var TPL = 'template_051qxhm';

    function sendResetCode() {
      var email = document.getElementById('fpEmail').value.trim();

      document.getElementById('emailError').style.display = 'none';
      document.getElementById('notFoundError').style.display = 'none';

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        return;
      }

      var btn = document.getElementById('fpBtn');
      btn.disabled = true;
      btn.textContent = 'Sending code...';

      var resetCode = String(Math.floor(100000 + Math.random() * 900000));

      // Store in localStorage as backup (for reset-password.html to verify)
      localStorage.setItem('mohini_reset', JSON.stringify({
        email: email, code: resetCode, expires: Date.now() + 600000
      }));

      // Also save to Firestore (non-blocking)
      fsSetDoc('passwordResets', email, {
        code: resetCode, expires: Date.now() + 600000
      }).catch(function(){});

      // Send email immediately — don't wait for Firestore
      sendResetEmail(email, 'User', resetCode, btn);
    }

    function sendResetEmail(email, userName, resetCode, btn) {
      emailjs.send(SVC, TPL, {
        to_name: userName,
        to_email: email,
        verification_code: resetCode,
        from_name: 'Mohini CSC Centre',
        subject: 'Password Reset Code - Mohini CSC Centre',
        message: 'Hello ' + userName + ',\n\nYour password reset code is: ' + resetCode + '\n\nThis code expires in 10 minutes.\n\nIf you did not request this, ignore this email.\n\n-Mohini CSC Centre'
      }).then(function() {
        toast('Reset code sent to ' + email);
        setTimeout(function() {
          window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
        }, 1500);
      }).catch(function(err) {
        console.error('EmailJS error:', err);
        toast('Email sending failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
      });
    }

    var user = fbGetUser();
    if (user) {
      window.location.href = 'index.html';
    }

    var toastTimer;
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('show'); }, 5000);
    }
  </script>
</body>
</html>
