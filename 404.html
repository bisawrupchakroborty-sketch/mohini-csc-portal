<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | Mohini CSC Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f6f8fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    .anim-wrap {
      width: 300px;
      height: 300px;
      margin: 0 auto 24px;
    }
    lottie-player {
      width: 100%;
      height: 100%;
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(135deg, #1665d8 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #172033;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-primary {
      background: #1665d8;
      color: #fff;
      box-shadow: 0 2px 8px rgba(22,101,216,.3);
    }
    .btn-primary:hover {
      background: #0f4faa;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(22,101,216,.4);
    }
    .btn-secondary {
      background: #fff;
      color: #172033;
      border: 1px solid #e2e8f0;
    }
    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .links {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .links a {
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      transition: color .2s;
    }
    .links a:hover { color: #1665d8; }
    .url-bar {
      margin-top: 32px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #94a3b8;
      max-width: 100%;
      overflow: hidden;
    }
    .url-bar .icon { font-size: 14px; flex-shrink: 0; }
    .url-bar .url-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      color: #dc2626;
      font-weight: 500;
    }
    .countdown {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
    .countdown b { color: #1665d8; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .container > * {
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }
    .container > *:nth-child(1) { animation-delay: 0.1s; }
    .container > *:nth-child(2) { animation-delay: 0.2s; }
    .container > *:nth-child(3) { animation-delay: 0.3s; }
    .container > *:nth-child(4) { animation-delay: 0.4s; }
    .container > *:nth-child(5) { animation-delay: 0.5s; }
    .container > *:nth-child(6) { animation-delay: 0.6s; }
    .container > *:nth-child(7) { animation-delay: 0.7s; }
    .container > *:nth-child(8) { animation-delay: 0.8s; }
  </style>
</head>
<body>
  <div class="container">
    <div class="anim-wrap">
      <lottie-player
        src="assets/lottie/cat-404.json"
        background="transparent"
        speed="1"
        style="width:300px;height:300px"
        loop
        autoplay
      ></lottie-player>
    </div>
    <div class="code">404</div>
    <h1>Oops! Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="url-bar">
      <span class="icon">🔗</span>
      <span class="url-text" id="badUrl"></span>
    </div>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">← Go Home</a>
    </div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="admin.html">Admin</a>
    </div>
    <div class="countdown">Redirecting to home in <b id="timer">10</b> seconds...</div>
  </div>

  <script>
    // Show the bad URL
    document.getElementById('badUrl').textContent = window.location.href;

    // Auto redirect countdown
    var secs = 10;
    var timerEl = document.getElementById('timer');
    var iv = setInterval(function() {
      secs--;
      timerEl.textContent = secs;
      if (secs <= 0) {
        clearInterval(iv);
        window.location.href = 'index.html';
      }
    }, 1000);


  </script>
</body>
</html>
