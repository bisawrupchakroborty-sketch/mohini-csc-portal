<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohini CSC Centre — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;color:#fff;min-height:100vh;overflow:hidden;position:relative}
    @media(max-width:900px){body{overflow-y:auto}}

    /* Background */
    .bg{position:fixed;inset:0;z-index:0;background:url('logingbackground.png') center/cover no-repeat}
    .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(5,15,35,.7) 0%,rgba(10,25,55,.55) 40%,rgba(5,15,35,.4) 100%)}

    /* Particles */
    .particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .particle{position:absolute;border-radius:50%;background:rgba(255,255,255,.06);animation:floatUp linear infinite}
    .particle:nth-child(1){width:5px;height:5px;left:8%;animation-duration:14s;animation-delay:0s}
    .particle:nth-child(2){width:3px;height:3px;left:22%;animation-duration:11s;animation-delay:2s}
    .particle:nth-child(3){width:6px;height:6px;left:38%;animation-duration:16s;animation-delay:4s}
    .particle:nth-child(4){width:4px;height:4px;left:55%;animation-duration:12s;animation-delay:1s}
    .particle:nth-child(5){width:3px;height:3px;left:72%;animation-duration:13s;animation-delay:3s}
    .particle:nth-child(6){width:5px;height:5px;left:88%;animation-duration:10s;animation-delay:5s}

    @keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}
    @keyframes slideLeft{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shine{0%{left:-100%}30%,100%{left:100%}}
    @keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,130,246,.3)}50%{transform:scale(1.03);box-shadow:0 0 0 10px rgba(59,130,246,0)}}
    @keyframes tricolor{0%{width:0}100%{width:60px}}
    @keyframes borderGlow{0%{box-shadow:0 0 8px rgba(59,130,246,.4),0 0 20px rgba(59,130,246,.15)}25%{box-shadow:0 0 12px rgba(99,102,241,.5),0 0 30px rgba(99,102,241,.2)}50%{box-shadow:0 0 8px rgba(59,130,246,.4),0 0 20px rgba(59,130,246,.15)}75%{box-shadow:0 0 12px rgba(99,102,241,.5),0 0 30px rgba(99,102,241,.2)}100%{box-shadow:0 0 8px rgba(59,130,246,.4),0 0 20px rgba(59,130,246,.15)}}
    @keyframes borderRotate{from{--angle:0deg}to{--angle:360deg}}

    /* Main Layout */
    .main{position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-end;min-height:100vh;padding:40px 80px 40px 40px}

    /* Right Panel - Login Card */
    .right{width:100%;max-width:420px;animation:slideLeft .8s cubic-bezier(.22,1,.36,1) .3s forwards;opacity:0}
    .glass-card{background:rgba(10,25,50,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1.5px solid rgba(59,130,246,.3);border-radius:24px;padding:40px 36px;position:relative;animation:borderGlow 2.5s ease-in-out infinite;transition:border-color .4s}
    .logo-circle{width:90px;height:90px;margin:0 auto 16px;background:rgba(255,255,255,.08);border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;animation:logoPulse 3s ease-in-out infinite;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .logo-circle img{width:60px;height:60px;object-fit:contain;border-radius:50%}
    .card-title{font-size:26px;font-weight:900;text-align:center;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
    .card-subtitle{text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
    .tricolor-bar{display:flex;justify-content:center;margin-bottom:16px}
    .tricolor-bar div{height:3px;border-radius:2px;background:linear-gradient(90deg,#f97316,#fff 50%,#22c55e);animation:tricolor 1s ease .8s forwards;width:0}
    .card-desc{text-align:center;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px}

    .input-group{position:relative;margin-bottom:16px;animation:fadeIn .6s ease forwards;opacity:0}
    .input-group:nth-child(1){animation-delay:.5s}
    .input-group:nth-child(2){animation-delay:.6s}
    .input-group .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:rgba(255,255,255,.35);pointer-events:none}
    .input-group input{width:100%;padding:14px 16px 14px 48px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;font-size:14px;color:#fff;font-family:inherit;transition:all .3s;box-sizing:border-box}
    .input-group input::placeholder{color:rgba(255,255,255,.35)}
    .input-group input:focus{outline:none;border-color:rgba(96,165,250,.5);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(96,165,250,.1)}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.35);cursor:pointer;font-size:16px;padding:4px;transition:color .2s}
    .eye-btn:hover{color:rgba(255,255,255,.7)}

    .login-btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:all .25s;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;gap:10px;animation:fadeIn .6s ease .7s forwards;opacity:0}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,99,235,.5)}
    .login-btn:active{transform:translateY(0) scale(.98)}
    .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shine 3s infinite}

    .error-text{color:#fca5a5;font-size:12px;margin-top:6px;display:none}

    .links{display:flex;justify-content:center;gap:20px;margin-top:18px;animation:fadeIn .6s ease .8s forwards;opacity:0}
    .links a{color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;transition:color .2s}
    .links a:hover{color:#fff}

    .signup-link{text-align:center;margin-top:20px;font-size:13px;color:rgba(255,255,255,.45);animation:fadeIn .6s ease .9s forwards;opacity:0}
    .signup-link a{color:#fff;font-weight:600;text-decoration:none;position:relative}
    .signup-link a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:#fff;border-radius:2px;transition:width .3s}
    .signup-link a:hover::after{width:100%}

    .footer{text-align:center;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:12px;animation:fadeIn .6s ease 1s forwards;opacity:0}
    .footer span{font-size:12px;color:rgba(255,255,255,.35)}
    .footer .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2)}

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(23,32,51,.92);color:#fff;padding:12px 28px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:999;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:900px){
      .main{justify-content:center;padding:24px 20px;gap:30px;overflow-y:auto;min-height:auto}
      .right{max-width:100%}
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

  <div class="main">
    <!-- Login Card -->
    <div class="right">
      <div class="glass-card">
        <div class="logo-circle">
          <img src="logo.png" alt="Mohini CSC">
        </div>
        <div class="card-title">Mohini CSC</div>
        <div class="card-subtitle">Partner Login</div>
        <div class="tricolor-bar"><div></div></div>
        <div class="card-desc">Access your CSC partner dashboard</div>

        <div class="input-group">
          <span class="icon">👤</span>
          <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
          <div class="error-text" id="emailError">Please enter a valid email address</div>
        </div>

        <div class="input-group" style="animation-delay:.6s">
          <span class="icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
          <button class="eye-btn" type="button" onclick="togglePass()" id="eyeBtn">👁</button>
          <div class="error-text" id="passwordError">Please enter your password</div>
        </div>

        <button class="login-btn" id="loginBtn" onclick="doLogin()">
          <span class="btn-shine"></span>
          <span>→</span> Login
        </button>

        <div class="links">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <p class="signup-link">Don't have an account? <a href="signup.html">Signup here</a></p>
      </div>

      <div class="footer">
        <span>Digital Seva</span>
        <div class="dot"></div>
        <span>Viksit Bharat</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Check maintenance mode — BLOCK page until checked
    (function() {
      var maintenanceOverlay = document.createElement('div');
      maintenanceOverlay.id = 'maintenanceCheck';
      maintenanceOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center';
      maintenanceOverlay.innerHTML = '<div style="text-align:center;color:#64748b"><div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#1665d8;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div><p>Loading...</p></div>';
      document.body.appendChild(maintenanceOverlay);

      var style = document.createElement('style');
      style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
      document.head.appendChild(style);

      fsGetDoc('settings', 'maintenance').then(function(doc) {
        if (doc && doc.enabled === true) {
          document.body.innerHTML = '';
          document.body.style.cssText = 'margin:0;padding:0;overflow:hidden';
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap';
          document.head.appendChild(link);
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js';
          s.onload = function() {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f6f8fb;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px"><div style="max-width:480px;width:100%"><div style="width:300px;height:300px;margin:0 auto 24px"><lottie-player src="assets/lottie/maintenance.json" background="transparent" speed="1" style="width:300px;height:300px" loop autoplay></lottie-player></div><h1 style="font-size:28px;font-weight:800;color:#172033;margin-bottom:12px">Under Maintenance</h1><p style="color:#64748b;font-size:15px;line-height:1.6;margin-bottom:32px">We are currently performing some updates to serve you better. We will be back shortly. Thank you for your patience!</p><p style="color:#94a3b8;font-size:12px;margin-top:32px">Established 2017 · Mohini CSC Centre</p></div></div>';
          };
          document.head.appendChild(s);
        } else {
          var ov = document.getElementById('maintenanceCheck');
          if (ov) ov.remove();
        }
      }).catch(function() {
        var ov = document.getElementById('maintenanceCheck');
        if (ov) ov.remove();
      });
    })();

    function togglePass(){
      const inp=document.getElementById('loginPassword');
      const btn=document.getElementById('eyeBtn');
      if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
      else{inp.type='password';btn.textContent='👁'}
    }

    // Client-side rate limiting
    var _loginAttempts = parseInt(localStorage.getItem('mohini_login_attempts') || '0');
    var _loginLockUntil = parseInt(localStorage.getItem('mohini_login_lock') || '0');

    async function doLogin(){
      if (Date.now() < _loginLockUntil) {
        var mins = Math.ceil((_loginLockUntil - Date.now()) / 60000);
        document.getElementById('emailError').style.display='block';
        document.getElementById('emailError').textContent='Too many attempts. Try again in ' + mins + ' min.';
        return;
      }

      var email=document.getElementById('loginEmail').value.trim();
      var password=document.getElementById('loginPassword').value;
      document.getElementById('emailError').style.display='none';
      document.getElementById('passwordError').style.display='none';

      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        document.getElementById('emailError').style.display='block';return;
      }
      if(!password){
        document.getElementById('passwordError').style.display='block';
        document.getElementById('passwordError').textContent='Please enter your password';return;
      }

      var btn=document.getElementById('loginBtn');
      btn.disabled=true;btn.textContent='Logging in...';

      try {
        var cred = await fbAuth.signInWithEmailAndPassword(email, password);
        var uid = cred.user.uid;

        // Get profile from Firestore (non-blocking, with fallback)
        var profile = null;
        try { profile = await Promise.race([fsGetDoc('partners', uid), new Promise(function(_,r){setTimeout(r,5000)})]); } catch(e){}

        // Determine partnerId - check profile first, then fallback to partnerIds collection
        var partnerId = (profile && profile.partnerId) ? profile.partnerId : '';
        if (!partnerId) {
          // Fallback 1: query partnerIds by usedBy UID
          try {
            var boughtIds = await Promise.race([
              fsQuery('partnerIds', 'usedBy', '==', uid),
              new Promise(function(_,r){setTimeout(r,5000)})
            ]);
            if (boughtIds && boughtIds.length > 0 && boughtIds[0].partnerId) {
              partnerId = boughtIds[0].partnerId;
            }
          } catch(e){}
        }
        if (!partnerId) {
          // Fallback 2: query ALL partnerIds to find one matching this user's email/name
          try {
            var allIds = await Promise.race([
              fsGetCollection('partnerIds'),
              new Promise(function(_,r){setTimeout(r,5000)})
            ]);
            if (allIds && allIds.length > 0) {
              var match = allIds.find(function(d) {
                return d.usedBy === uid || (d.email && d.email === email) || (d.phone && profile && d.phone === profile.mobile);
              });
              if (match && match.partnerId) {
                partnerId = match.partnerId;
              }
            }
          } catch(e){}
        }
        // Save partnerId to profile for future logins
        if (partnerId) {
          fsSetDoc('partners', uid, { partnerId: partnerId }).catch(function(){});
        }

        var loginData = {
          method: 'firebase',
          contact: email,
          partnerId: partnerId,
          name: (profile && profile.name) ? profile.name : cred.user.displayName || email,
          mobile: (profile && profile.mobile) ? profile.mobile : '',
          loggedIn: true,
          loginTime: new Date().toISOString(),
          uid: uid
        };
        localStorage.setItem('mohini_partner_login', JSON.stringify(loginData));
        localStorage.removeItem('mohini_login_attempts');
        localStorage.removeItem('mohini_login_lock');
        toast('Login successful! Redirecting...');
        setTimeout(function() { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        btn.disabled=false;btn.innerHTML='<span class="btn-shine"></span><span>→</span> Login';
        _loginAttempts++;
        localStorage.setItem('mohini_login_attempts', _loginAttempts);
        if (_loginAttempts >= 5) {
          _loginLockUntil = Date.now() + 900000;
          localStorage.setItem('mohini_login_lock', _loginLockUntil);
          document.getElementById('emailError').style.display='block';
          document.getElementById('emailError').textContent='Too many attempts. Locked for 15 minutes.';
        } else {
          var msg = err.message || 'Login failed';
          if (msg.includes('too-many-requests')) {
            document.getElementById('emailError').style.display='block';
            document.getElementById('emailError').textContent='Too many attempts. Try again later.';
          } else {
            document.getElementById('emailError').style.display='block';
            document.getElementById('emailError').textContent='Invalid email or password. (' + _loginAttempts + '/5 attempts)';
          }
        }
      }
    }

    document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
    document.getElementById('loginEmail').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginPassword').focus()});

    let toastTimer;
    function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
  </script>
</body>
</html>
