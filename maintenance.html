<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Maintenance | Mohini CSC Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f6f8fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    .anim-wrap {
      width: 300px;
      height: 300px;
      margin: 0 auto 24px;
    }
    lottie-player {
      width: 100%;
      height: 100%;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #172033;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-primary {
      background: #1665d8;
      color: #fff;
      box-shadow: 0 2px 8px rgba(22,101,216,.3);
    }
    .btn-primary:hover {
      background: #0f4faa;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(22,101,216,.4);
    }
    .links {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .links a {
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      transition: color .2s;
    }
    .links a:hover { color: #1665d8; }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .container > * {
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }
    .container > *:nth-child(1) { animation-delay: 0.1s; }
    .container > *:nth-child(2) { animation-delay: 0.2s; }
    .container > *:nth-child(3) { animation-delay: 0.3s; }
    .container > *:nth-child(4) { animation-delay: 0.4s; }
    .container > *:nth-child(5) { animation-delay: 0.5s; }
    .container > *:nth-child(6) { animation-delay: 0.6s; }
  </style>
</head>
<body>
  <div class="container">
    <div class="anim-wrap">
      <lottie-player
        src="assets/lottie/maintenance.json"
        background="transparent"
        speed="1"
        style="width:300px;height:300px"
        loop
        autoplay
      ></lottie-player>
    </div>
    <h1>Under Maintenance</h1>
    <p>We're currently performing some updates to serve you better. We'll be back shortly. Thank you for your patience!</p>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="admin.html">Admin</a>
    </div>
    <div class="footer">Established 2017 · Mohini CSC Centre</div>
  </div>
</body>
</html>
